name: Build macOS .app

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-macos:
    runs-on: macos-latest
    defaults:
      run:
        shell: bash

    steps:
    - name: CHECKOUT
      uses: actions/checkout@v4

    - name: ENV 
      run: echo "APP_NAME=respling" >> $GITHUB_ENV

    - name: RUST
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true

    - name: BREW
      run: |
        brew update
        brew install qt@6 brotli webp cmake

    - name: BUILD(sharpyuv)
      run: |
        git config --global --add safe.directory $GITHUB_WORKSPACE
        git clone --depth 1 https://github.com/zetaboo/sharpyuv.git
        cd sharpyuv
        mkdir build && cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release
        make
        cp libsharpyuv.dylib ../../
      shell: bash

    - name: BUILD
      run: cargo build --release

    - name: BUNDLE
      run: |
        APP_NAME="respling"
        mkdir -p $APP_NAME.app/Contents/MacOS
        cp target/release/$APP_NAME $APP_NAME.app/Contents/MacOS/
        mkdir -p $APP_NAME.app/Contents/Resources
        mkdir -p $APP_NAME.app/Contents/Frameworks
        cp /opt/homebrew/opt/brotli/lib/libbrotlicommon.1.dylib $APP_NAME.app/Contents/Frameworks/
        cp /opt/homebrew/opt/webp/lib/libwebp.7.dylib $APP_NAME.app/Contents/Frameworks/
        cp sharpyuv/libsharpyuv.dylib $APP_NAME.app/Contents/Frameworks/
        export PATH="/opt/homebrew/opt/qt@6/bin:$PATH"
        export DYLD_FRAMEWORK_PATH="/opt/homebrew/opt/qt@6/lib"
        macdeployqt $APP_NAME.app -no-sign

    - name: ARCHIVE
      run: |
        APP_NAME="respling"
        tar -czvf $APP_NAME-macos.tar.gz $APP_NAME.app

    - name: UPLOAD
      uses: actions/upload-artifact@v4
      with:
        name: respling-macos
        path: respling-macos.tar.gz

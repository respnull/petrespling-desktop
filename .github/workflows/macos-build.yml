name: Build macOS .app

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-macos:
    runs-on: macos-latest
    defaults:
      run:
        shell: bash

    steps:
    - name: CHECKOUT
      uses: actions/checkout@v4

    - name: ENV 
      run: echo "APP_NAME=respling" >> $GITHUB_ENV

    - name: RUST
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true

    - name: BREW
      run: |
        brew update
        brew install qt@6 brotli webp cmake

    - name: BUILD
      run: cargo build --release

    - name: BUNDLE
      run: |
        APP_NAME="respling"
        mkdir -p $APP_NAME.app/Contents/MacOS
        cp target/release/$APP_NAME $APP_NAME.app/Contents/MacOS/
        mkdir -p $APP_NAME.app/Contents/Resources
        mkdir -p $APP_NAME.app/Contents/Frameworks
        cp /opt/homebrew/opt/brotli/lib/libbrotlicommon.1.dylib $APP_NAME.app/Contents/Frameworks/
        cp /opt/homebrew/opt/webp/lib/libwebp.7.dylib $APP_NAME.app/Contents/Frameworks/
        export PATH="/opt/homebrew/opt/qt@6/bin:$PATH"
        export DYLD_FRAMEWORK_PATH="/opt/homebrew/opt/qt@6/lib"
        chmod +w respling.app/Contents/Frameworks/*.dylib
        codesign --force --sign "-" respling.app/Contents/Frameworks/libbrotlicommon.1.dylib
        codesign --force --sign "-" respling.app/Contents/Frameworks/libwebp.7.dylib
        macdeployqt respling.app -no-codesign -no-strip -qmldir=src
        codesign --force --deep --sign - respling.app
        codesign --verify --deep --strict --verbose=2 respling.app
        xattr -rd com.apple.quarantine respling.app
        spctl -a -vv respling.app

    - name: ARCHIVE
      run: |
        APP_NAME="respling"
        tar -czvf $APP_NAME-macos.tar.gz $APP_NAME.app

    - name: UPLOAD
      uses: actions/upload-artifact@v4
      with:
        name: respling-macos
        path: respling-macos.tar.gz

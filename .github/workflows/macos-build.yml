name: Build macOS .app

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-macos:
    runs-on: macos-latest
    defaults:
      run:
        shell: bash

    steps:
    - name: CHECKOUT
      uses: actions/checkout@v4

    - name: RUST
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true

    - name: BREW
      run: |
        brew update
        brew install qt@6
        echo 'export PATH="/usr/local/opt/qt@6/bin:$PATH"' >> $GITHUB_ENV
        echo 'export LDFLAGS="-L/usr/local/opt/qt@6/lib"' >> $GITHUB_ENV
        echo 'export CPPFLAGS="-I/usr/local/opt/qt@6/include"' >> $GITHUB_ENV

    - name: BUILD
      run: |
        cargo build --release

    - name: BUNDLE
      run: |
        APP_NAME="respling"
        mkdir -p $APP_NAME.app/Contents/MacOS
        cp target/release/$APP_NAME $APP_NAME.app/Contents/MacOS/
        mkdir -p $APP_NAME.app/Contents/Resources
        macdeployqt $APP_NAME.app --qmldir="src"

    - name: ARCHIVE
      run: |
        tar -czvf MyApp-macos.tar.gz MyApp.app

    - name: UPLOAD
      uses: actions/upload-artifact@v3
      with:
        name: respling-macos
        path: respling-macos.tar.gz
